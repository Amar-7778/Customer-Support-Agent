version: '3.8'

services:
  support-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novintix_support_agent
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    restart: unless-stopped
